<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會計學闖關讀書站</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 配色：主色用圖標的深藍（專注、穩定），金色只用在經驗值與獎勵，暖橘用在情境與提醒，
   每一章一個柔和的代表色幫助分辨；答錯用柔和珊瑚色，避免刺眼的紅造成壓力 */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --ink:#172238; --muted:#5b6880; --line:#dde3ef;
  --accent:#2f6bd8; --accent-bg:#e8effc; --pink:#dd7a2c; --pink-bg:#fdf1e6;
  --gold:#d6971a; --gold-bg:#fdf5df; --head1:#132347; --head2:#1f3c7a; --head-ink:#ffffff;
  --good:#1f9a5a; --good-bg:#e5f6ec; --bad:#d9604c; --bad-bg:#fdeeeb; --warn:#c98a12;
  --cc:var(--accent); --cc-bg:var(--accent-bg);
  --display:"LXGW WenKai TC","Noto Sans TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
.c0{--cc:#2f6bd8;--cc-bg:#e8effc} .c1{--cc:#13968a;--cc-bg:#e1f4f1} .c2{--cc:#7458d0;--cc-bg:#efebfb} .c3{--cc:#cf7a22;--cc-bg:#fcf0e2} .c4{--cc:#c9517a;--cc-bg:#fbe9f0}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1424; --surface:#151f35; --ink:#e4eaf6; --muted:#97a4bd; --line:#26324c;
    --accent:#6b9cf5; --accent-bg:#1b2b4d; --pink:#f0a061; --pink-bg:#3a2a1c;
    --gold:#f0bf4c; --gold-bg:#3a3018; --head1:#0a1430; --head2:#18306a; --head-ink:#ffffff;
    --good:#55cf8c; --good-bg:#15301f; --bad:#f08a78; --bad-bg:#3a201c; --warn:#e8b54a;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .c0{--cc:#6b9cf5;--cc-bg:#1b2b4d} :root:not([data-theme="light"]) .c1{--cc:#4fcfc0;--cc-bg:#123430} :root:not([data-theme="light"]) .c2{--cc:#a690f2;--cc-bg:#272046} :root:not([data-theme="light"]) .c3{--cc:#f0a961;--cc-bg:#38291a} :root:not([data-theme="light"]) .c4{--cc:#ee8db0;--cc-bg:#3a1d2a}
}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#151f35; --ink:#e4eaf6; --muted:#97a4bd; --line:#26324c;
  --accent:#6b9cf5; --accent-bg:#1b2b4d; --pink:#f0a061; --pink-bg:#3a2a1c;
  --gold:#f0bf4c; --gold-bg:#3a3018; --head1:#0a1430; --head2:#18306a; --head-ink:#ffffff;
  --good:#55cf8c; --good-bg:#15301f; --bad:#f08a78; --bad-bg:#3a201c; --warn:#e8b54a;
  color-scheme:dark;
}
:root[data-theme="dark"] .c0{--cc:#6b9cf5;--cc-bg:#1b2b4d} :root[data-theme="dark"] .c1{--cc:#4fcfc0;--cc-bg:#123430} :root[data-theme="dark"] .c2{--cc:#a690f2;--cc-bg:#272046} :root[data-theme="dark"] .c3{--cc:#f0a961;--cc-bg:#38291a} :root[data-theme="dark"] .c4{--cc:#ee8db0;--cc-bg:#3a1d2a}
.top .bar{background:rgba(255,255,255,.18)}
.top .bar>i{background:linear-gradient(90deg,#f6d36b,var(--gold))}
.top .muted{color:rgba(255,255,255,.72)}
.top .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.top .chip.swap{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.16)}
.top .flame{color:#ffb35c}
.ch{border-left:5px solid var(--cc)!important}
.cpage .tbl th{background:var(--cc-bg);color:var(--cc)}
.cpage .link{color:var(--cc)}
.ch-no{background:var(--cc-bg)!important;color:var(--cc)!important}
.wrap.cpage h1{color:var(--cc)}
.lesson h4{color:var(--cc)!important}
.key{background:var(--cc-bg)!important;border-left-color:var(--cc)!important}
.today-card{background:linear-gradient(135deg,var(--accent-bg),var(--gold-bg));border-color:transparent}
.pill.xp{background:var(--gold-bg);color:var(--gold)}
.q-card{border-top:4px solid var(--cc)}
.q-card .chtag{color:var(--cc);font-weight:700}
.flash{border-color:var(--cc)}
.flash.back{border-color:var(--cc)!important;background:var(--cc-bg)!important}
.btn{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000))}
.btn.soft{background:var(--accent-bg)}
.btn.ghost{background:transparent}
.btn.pink{background:var(--pink)}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{background:var(--accent-bg);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box}
.chips .book.on{border-color:var(--cc);background:var(--cc-bg);color:var(--cc)}
.big{color:var(--accent)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,var(--head1),var(--head2));color:var(--head-ink);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lv{display:flex;flex-direction:column;flex:1;min-width:0}
.lv-name{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--cc);border-radius:99px;transition:width .4s}
.bar.pink>i{background:var(--pink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.flame{color:var(--pink)}

.wrap{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;min-height:48px;font-size:16px}
:root[data-theme="dark"] .btn{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201c}}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.pink{background:var(--pink)}
.btn.soft{background:var(--accent-bg);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0}

.books{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.book{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.unitgrp{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.chhead{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-weight:700;color:var(--cc);cursor:pointer;text-align:left;font-size:16px}
.chhead .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--cc);display:grid;place-items:center;font-size:13px;flex:none}
.chhead.all .box,.chhead.some .box{background:var(--cc);color:#fff}
.unitgrp .chips .book{font-weight:500;font-size:14px;padding:6px 12px}
.chips .book{flex:0 1 auto;max-width:100%;text-align:left}
.swap{cursor:pointer;color:var(--accent);font-weight:700;border-color:var(--accent)}
.shelf-book.on{border-color:var(--accent)}
.ch-no.cover{background:var(--pink-bg);color:var(--pink);font-size:16px}
.book.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}

.goal{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.sug{display:flex;flex-direction:column;gap:8px}
.sug button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer}
.sug b{font-weight:700}
.pill{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--pink-bg);color:var(--pink);font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}

.ch{display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;width:100%}
.ch-no{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.ch-body{flex:1;min-width:0}
.ch-title{font-weight:700}

.story{background:var(--pink-bg);border-color:transparent}
.story h3{color:var(--pink)}
.lesson-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}

.lesson h4{margin:6px 0 0;font-size:16px;color:var(--accent)}
.lesson ul{margin:0;padding-left:20px}
.lesson li{margin:2px 0}
.key{background:var(--accent-bg);border-left:4px solid var(--accent);padding:10px 12px;border-radius:0 10px 10px 0}
.tip{background:var(--pink-bg);border-left:4px solid var(--pink);padding:10px 12px;border-radius:0 10px 10px 0}
.je{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0}
.je td{padding:6px 8px;border-bottom:1px dashed var(--line)}
.je td:first-child{width:2.5em;color:var(--muted)}
.je td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.je tr.cr td:nth-child(2){padding-left:28px}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:300px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-bg);color:var(--accent)}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}

.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.q-text{font-size:18px;font-weight:700;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-size:16px;text-align:center;min-height:58px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.4;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt .lab{font-size:13px;opacity:.7;font-weight:700}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb b.t{font-size:17px}
.fb.ok b.t{color:var(--good)} .fb.no b.t{color:var(--bad)}
.combo{color:var(--pink);font-weight:700}

.flash{min-height:220px;border:2px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;cursor:pointer;gap:10px;width:100%}
.flash .side{font-size:13px;color:var(--muted)}
.flash .face{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.5}
.flash.back{border-color:var(--accent);background:var(--accent-bg)}
.flash.back .face{font-family:var(--body);font-size:18px}
.boxes{display:flex;gap:6px}
.boxes span{flex:1;text-align:center;font-size:12px;padding:4px 0;border-radius:8px;background:var(--bg);border:1px solid var(--line)}

.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.timer.low{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.dots button.ans{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.dots button.cur{outline:2px solid var(--pink)}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.chbar{display:grid;grid-template-columns:7em 1fr 3.5em;gap:8px;align-items:center;font-size:14px}

textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink)}
details summary{cursor:pointer;font-weight:700}
details .why{display:flex;flex-direction:column;gap:8px;margin-top:10px}
details .why div{font-size:15px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;min-height:58px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:700}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:440px){.chip.today{display:none}}
@media (max-width:380px){.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>

<!-- 課本資料：新增課本 = 在 books/ 放一個檔案，再加一行 script -->
<script src="books/accounting-3.js"></script>
<script>
/* ===================== 課本格式 =====================
   每本書：{id,title,subtitle,chapters:[{title,story,lessons:[{title,body,check}],cards:[[正面,背面]],questions:[{q,o:[4個選項],a:正確選項的索引,e:解析}]}]}
   選項顯示時會自動打亂順序。 */

const EXAMPLE_BOOK={title:'經濟學（一）',subtitle:'範例：自己加課本',chapters:[{title:'需求與供給',story:'用一句話說這章在學什麼（可省略）',lessons:[{title:'需求法則',body:'價格上升，需求量下降。\n其他條件不變。',check:{q:'價格上升時，需求量會？',o:['下降','上升','不變','先升後降'],a:0,e:'需求法則：價格與需求量反方向。'}}],cards:[['需求法則','價格與需求量反方向變動']],questions:[{q:'需求曲線通常是？',o:['負斜率','正斜率','水平','垂直'],a:0,e:'價格越高，需求量越少，所以往右下。'}]}]};

/* ===================== 狀態（只存在這台裝置的瀏覽器） ===================== */
const KEY='acc-study-v1';
const LEVELS=['記帳新手','小出納','記帳員','會計助理','會計專員','資深會計','會計主任','財務經理','財務長','會計大師'];
const BOX_DAYS=[0,1,2,4,7,14];
function defState(){return {xp:0,streak:0,last:'',today:{d:'',n:0},goal:10,done:{},wrong:{},cards:{},exams:[],seen:{},custom:[],book:'acc3'}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(defState(),s)}catch(e){return defState()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dstr(new Date())}
function addDays(s,n){const p=s.split('-');const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return dstr(d)}
function curStreak(){const t=today();return (S.last===t||S.last===addDays(t,-1))?S.streak:0}
function touch(){const t=today();if(S.last===t)return;S.streak=(S.last===addDays(t,-1))?S.streak+1:1;S.last=t}

function allBooks(){return (window.BOOKS||[]).concat(S.custom||[])}
function book(){return allBooks().find(b=>b.id===S.book)||allBooks()[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function allQs(b,chi){const out=[];b.chapters.forEach((c,ci)=>{if(chi!=null&&ci!==chi)return;(c.questions||[]).forEach((q,qi)=>out.push(Object.assign({id:b.id+':'+ci+':'+qi,ch:ci},q)))});return out}
function findQ(id){const p=id.split(':');const b=allBooks().find(x=>x.id===p[0]);if(!b)return null;const ci=+p[1],c=b.chapters[ci];if(!c)return null;
 if(p[2][0]==='L'){const li=+p[2].slice(1),l=(c.lessons||[])[li];if(!l||!l.check)return null;return Object.assign({id,ch:ci,u:li,book:b},l.check)}
 if(!c.questions[+p[2]])return null;return Object.assign({id,ch:ci,book:b},c.questions[+p[2]])}

/* ===================== 經驗值與回饋 ===================== */
function level(){return Math.floor(S.xp/100)}
function addXP(n,msg){const before=level();S.xp+=n;save();renderTop();if(level()>before){celebrate();toast('升級！你現在是「'+LEVELS[Math.min(level(),LEVELS.length-1)]+'」')}else if(msg!==false){toast('+'+n+' 經驗'+(msg?'　'+msg:''))}}
function gotRight(){touch();const t=today();if(S.today.d!==t)S.today={d:t,n:0};S.today.n++;save();if(S.today.n===S.goal){setTimeout(()=>{celebrate();toast('今日目標完成！連續 '+curStreak()+' 天')},700)}renderTop()}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800)}

 card.appendChild(mcq(q,ok=>{if(ok){Q.right++;Q.combo++;const g=Q.combo>=3?15:10;Q.xp+=g;addXP(g,Q.combo>=3?'連對 '+Q.combo+' 題！':'');if(Q.mode==='wrong'){delete S.wrong[q.id];save()}}

let examSel=null,examN=15;
function unitsOf(c){return (c.lessons&&c.lessons.length)?c.lessons.map(l=>l.title):['全章']}
/* 依選取的單元收集題目：章節題目＋每課的小檢查，題目文字相同的只留一題 */
function examPool(b){const out=[],txt=new Set();
 b.chapters.forEach((c,ci)=>{const sel=examSel.on[ci],any=sel.some(Boolean);
  const add=(q,id,u)=>{if(txt.has(q.q))return;const ok=(typeof u==='number'&&u>=0&&u<sel.length)?sel[u]:any;if(!ok)return;txt.add(q.q);out.push(Object.assign({},q,{id,ch:ci,u}))};
  (c.questions||[]).forEach((q,qi)=>add(q,b.id+':'+ci+':'+qi,q.u));
  (c.lessons||[]).forEach((l,li)=>{if(l.check)add(l.check,b.id+':'+ci+':L'+li,li)})});
 return out}
/* 優先出考過次數最少的題目，同一份考卷不會重複 */
function pickFresh(pool,n){return shuffle(pool.map(q=>({q,k:(S.seen&&S.seen[q.id]||0)+Math.random()*.9})).sort((a,c)=>a.k-c.k).slice(0,n).map(x=>x.q))}
function rerenderExam(){const y=window.scrollY;go('exam');window.scrollTo(0,y)}
function vExamIntro(app){const b=book();
 if(!examSel||examSel.b!==b.id)examSel={b:b.id,on:b.chapters.map(c=>unitsOf(c).map(()=>true))};
 app.appendChild(h('<h1>模擬考</h1>'));
 const units=examSel.on.reduce((n,a)=>n+a.filter(Boolean).length,0);
 const pick=h('<section class="card"><div class="row between"><h3>選擇單元</h3><span class="small muted">已選 '+units+' 個</span></div><p class="small muted">可以複選。點章節名稱會選取或取消整章。</p>'+
  b.chapters.map((c,ci)=>{const sel=examSel.on[ci],k=sel.filter(Boolean).length;
   return '<div class="unitgrp c'+(ci%5)+'"><button class="chhead'+(k===sel.length?' all':k?' some':'')+'" data-ch="'+ci+'"><span class="box">'+(k===sel.length?'✓':k?'–':'')+'</span>第 '+(ci+1)+' 章　'+esc(c.title)+'</button><div class="chips">'+
   unitsOf(c).map((t,li)=>'<button class="book c'+(ci%5)+(sel[li]?' on':'')+'" data-u="'+ci+':'+li+'">'+(sel[li]?'✓ ':'')+esc(t)+'</button>').join('')+'</div></div>'}).join('')+
  '<div class="row"><button class="link" data-all>全部選取</button><button class="link" data-none style="color:var(--muted)">全部取消</button></div></section>');
 pick.onclick=e=>{const u=e.target.closest('[data-u]'),c=e.target.closest('[data-ch]');
  if(u){const [ci,li]=u.dataset.u.split(':').map(Number);examSel.on[ci][li]=!examSel.on[ci][li];rerenderExam()}
  else if(c){const ci=+c.dataset.ch,all=examSel.on[ci].every(Boolean);examSel.on[ci]=examSel.on[ci].map(()=>!all);rerenderExam()}
  else if(e.target.closest('[data-all]')){examSel.on=examSel.on.map(a=>a.map(()=>true));rerenderExam()}
  else if(e.target.closest('[data-none]')){examSel.on=examSel.on.map(a=>a.map(()=>false));rerenderExam()}};
 app.appendChild(pick);
 const pool=examPool(b);const opts=[10,15,20,0];
 const cnt=h('<section class="card"><h3>題數</h3><div class="chips">'+opts.map(o=>'<button class="book'+(examN===o?' on':'')+'" data-n="'+o+'">'+(o?o+' 題':'全部')+'</button>').join('')+'</div></section>');
 cnt.onclick=e=>{const x=e.target.closest('[data-n]');if(x){examN=+x.dataset.n;rerenderExam()}};app.appendChild(cnt);
 const n=examN?Math.min(examN,pool.length):pool.length,mins=Math.max(5,Math.round(n*4/3));
 const fresh=pool.filter(q=>!(S.seen&&S.seen[q.id])).length;
 app.appendChild(h('<section class="card"><p>選好的單元共有 <b class="num">'+pool.length+'</b> 題，這次出 <b class="num">'+n+'</b> 題，限時 <b class="num">'+mins+'</b> 分鐘。</p><p class="small muted">同一份考卷不會出現重複的題目，而且會先出你還沒考過的題目（還有 '+fresh+' 題沒考過）。'+(examN&&pool.length<examN?'選的單元題目比較少，所以只出 '+pool.length+' 題。':'')+'</p><p>作答時不會馬上告訴你對錯，交卷後才看成績和每一章的答對率。</p></section>'));
 const st=h('<button class="btn block"'+(n?'':' disabled')+'>'+(n?'開始考試':'請至少選一個單元')+'</button>');st.onclick=()=>startExam(pickFresh(pool,n),mins);app.appendChild(st);
 const hist=S.exams.filter(e=>e.b===b.id).slice(-5).reverse();if(hist.length)app.appendChild(h('<section class="card"><h3>最近成績</h3>'+hist.map(e=>'<div class="row between"><span class="muted small num">'+e.d+'</span><b class="num">'+e.s+' 分</b></div>').join('')+'</section>'))}
let E=null;
function startExam(items,mins){E={items:items.map(q=>Object.assign({},q,{list:shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))})),ans:{},i:0,end:Date.now()+(mins||20)*60*1000};view='exam';renderTabs();drawExam();clearInterval(timer);timer=setInterval(()=>{const el=document.getElementById('tm');if(!el)return;const s=Math.max(0,Math.round((E.end-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('low',s<120);if(s<=0){clearInterval(timer);examDone()}},500)}
function drawExam(){const app=document.getElementById('app');app.innerHTML='';window.scrollTo(0,0);const q=E.items[E.i];
 app.appendChild(h('<div class="q-top"><span>模擬考・第 <span class="num">'+(E.i+1)+'/'+E.items.length+'</span> 題</span><span class="timer" id="tm">--:--</span></div>'));
 const dots=h('<div class="dots">'+E.items.map((x,i)=>'<button class="num '+(E.ans[i]!=null?'ans ':'')+(i===E.i?'cur':'')+'" data-j="'+i+'">'+(i+1)+'</button>').join('')+'</div>');
 dots.onclick=e=>{const b=e.target.closest('[data-j]');if(b){E.i=+b.dataset.j;drawExam()}};app.appendChild(dots);
 const card=h('<section class="card q-card c'+(q.ch%5)+'"><p class="q-text">'+esc(q.q)+'</p>'+optsHTML(q.list)+'</section>');
 card.querySelectorAll('.opt').forEach((x,j)=>{if(E.ans[E.i]===j)x.classList.add('sel')});
 card.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;E.ans[E.i]=+b.dataset.i;drawExam()};app.appendChild(card);
 const last=E.i===E.items.length-1;const nav=h('<div class="grid2"><button class="btn soft"'+(E.i===0?' disabled':'')+'>← 上一題</button><button class="btn'+(last?' pink':'')+'">'+(last?'交卷':'下一題 →')+'</button></div>');
 nav.children[0].onclick=()=>{E.i--;drawExam()};nav.children[1].onclick=()=>{if(last){const un=E.items.length-Object.keys(E.ans).length;if(un&&!E.warned){E.warned=1;toast('還有 '+un+' 題沒寫，再按一次交卷');return}clearInterval(timer);examDone()}else{E.i++;drawExam()}};
 app.appendChild(nav);const s=Math.max(0,Math.round((E.end-Date.now())/1000));document.getElementById('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function examDone(){const b=book(),app=document.getElementById('app');app.innerHTML='';window.scrollTo(0,0);let r=0;const per={};const wrongs=[];
 E.items.forEach((q,i)=>{const ok=E.ans[i]!=null&&q.list[E.ans[i]].ok;per[q.ch]=per[q.ch]||[0,0];per[q.ch][1]++;if(ok){r++;per[q.ch][0]++;gotRight()}else{S.wrong[q.id]=(S.wrong[q.id]||0)+1;wrongs.push({q,pick:E.ans[i]!=null?q.list[E.ans[i]].t:'沒有作答'})}});
 S.seen=S.seen||{};E.items.forEach(q=>{S.seen[q.id]=(S.seen[q.id]||0)+1});const score=Math.round(r/E.items.length*100);S.exams.push({b:b.id,d:today(),s:score});touch();save();addXP(r*5+20,'模擬考');if(score>=80)celebrate();
 let weak=null,wv=2;Object.keys(per).forEach(k=>{const v=per[k][0]/per[k][1];if(v<wv){wv=v;weak=+k}});
 app.appendChild(h('<section class="card" style="align-items:center;text-align:center"><span class="muted">模擬考成績</span><span class="big num">'+score+' 分</span><span class="muted num">答對 '+r+' / '+E.items.length+'</span></section>'));
 const pc=h('<section class="card"><h3>各章答對率</h3>'+Object.keys(per).sort((a,c)=>a-c).map(k=>{const v=per[k];return '<div class="chbar"><span>第 '+(+k+1)+' 章</span><span class="bar"><i style="width:'+(v[0]/v[1]*100)+'%;background:'+(v[0]/v[1]<.6?'var(--bad)':v[0]/v[1]<.8?'var(--warn)':'var(--good)')+'"></i></span><span class="num small">'+v[0]+'/'+v[1]+'</span></div>'}).join('')+'</section>');app.appendChild(pc);
 if(weak!=null&&wv<1){const wb=h('<button class="btn block">最需要加強：第 '+(weak+1)+' 章 '+esc(b.chapters[weak].title)+' → 去練習</button>');wb.onclick=()=>startQuiz(shuffle(allQs(b,weak)).slice(0,10),'第 '+(weak+1)+' 章練習');app.appendChild(wb)}
 if(wrongs.length){const w=h('<section class="card"><h3>錯題檢討（已加入錯題本）</h3></section>');wrongs.forEach(x=>w.appendChild(h('<div class="fb no"><b>'+esc(x.q.q)+'</b><span>你選：'+esc(x.pick)+'</span><span>正確：'+esc(x.q.o[x.q.a])+'。'+esc(x.q.e||'')+'</span></div>')));app.appendChild(w)}
 const bb=h('<button class="btn soft block">回首頁</button>');bb.onclick=()=>go('home');app.appendChild(bb)}

/* ===================== 錯題本 ===================== */
function vWrong(app){const ids=wrongIds();const b=book();
 app.appendChild(h('<h1>錯題本</h1>'));
 if(!ids.length){app.appendChild(h('<section class="card"><p>目前沒有錯題。做練習或模擬考答錯的題目會自動收進來，重練答對就會移除。</p></section>'));return}
 app.appendChild(h('<p class="muted">共 '+ids.length+' 題。重練時答對一次就會從這裡畢業。</p>'));
 const st=h('<button class="btn block">重練錯題</button>');st.onclick=()=>startQuiz(shuffle(ids.map(findQ)).slice(0,10),'錯題重練','wrong');app.appendChild(st);
 ids.sort((a,c)=>S.wrong[c]-S.wrong[a]).forEach(id=>{const q=findQ(id);app.appendChild(h('<section class="card"><div class="row between"><span class="small muted">第 '+(q.ch+1)+' 章・'+esc(b.chapters[q.ch].title)+'</span><span class="pill">錯 '+S.wrong[id]+' 次</span></div><b>'+esc(q.q)+'</b><details><summary class="small">看答案</summary><p class="small" style="margin-top:6px">'+esc(q.o[q.a])+'。'+esc(q.e||'')+'</p></details></section>'))})}

/* ===================== 加課本 ===================== */
function vBooks(app){
 app.appendChild(h('<button class="link">← 回首頁</button>'));app.lastChild.onclick=()=>go('home');
 app.appendChild(h('<h1>加入新課本</h1>'));
 app.appendChild(h('<section class="card"><p>把課本資料貼到下面就能加入新課本。可以先按「填入範例」看看格式。</p><p class="small muted">格式：書名、章節、每章的課程（含小檢查）、閃卡、選擇題（a 是正確選項的位置，從 0 開始）。</p></section>'));
 const ta=h('<textarea id="bookjson" aria-label="課本資料" placeholder="把課本資料貼在這裡"></textarea>');app.appendChild(ta);
 const r=h('<div class="grid2"><button class="btn">加入課本</button><button class="btn soft">填入範例</button></div>');app.appendChild(r);
 const msg=h('<p class="small" role="status"></p>');app.appendChild(msg);
 r.children[1].onclick=()=>{ta.value=JSON.stringify(EXAMPLE_BOOK,null,1)};
 r.children[0].onclick=()=>{try{const bk=JSON.parse(ta.value);
   if(!bk.title||!Array.isArray(bk.chapters)||!bk.chapters.length)throw new Error('需要 title 和 chapters');
   bk.chapters.forEach((c,i)=>{if(!c.title)throw new Error('第 '+(i+1)+' 章沒有 title');c.lessons=c.lessons||[];c.cards=c.cards||[];c.questions=c.questions||[];c.questions.forEach((q,j)=>{if(!q.q||!Array.isArray(q.o)||typeof q.a!=='number'||q.a<0||q.a>=q.o.length)throw new Error('第 '+(i+1)+' 章第 '+(j+1)+' 題格式不對')})});
   bk.id='c'+Date.now().toString(36);bk.custom=true;S.custom.push(bk);S.book=bk.id;save();toast('已加入《'+bk.title+'》');go('home')}
  catch(e){msg.style.color='var(--bad)';msg.textContent='讀不懂這段資料：'+e.message+'。請確認是完整的 JSON 格式。'}};
 if(S.custom.length){const c=h('<section class="card"><h3>你加入的課本</h3></section>');S.custom.forEach(bk=>{const row=h('<div class="row between"><b>'+esc(bk.title)+'</b><button class="link" style="color:var(--bad)">刪除</button></div>');const del=row.querySelector('button');del.onclick=()=>{if(del.dataset.sure){S.custom=S.custom.filter(x=>x.id!==bk.id);if(S.book===bk.id)S.book=allBooks()[0].id;save();go('books')}else{del.dataset.sure=1;del.textContent='再按一次確認刪除'}};c.appendChild(row)});app.appendChild(c)}
 app.appendChild(h('<p class="small muted">進度、經驗值和加入的課本都存在這支手機的瀏覽器裡，換裝置不會同步。</p>'))}

renderTop();go('shelf');
</script>
